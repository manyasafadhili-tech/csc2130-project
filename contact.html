<!DOCTYPE html>

    <title>Contact | Fadhili Software Engineering Project</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f4f8fb;
            color: #243b53;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
        }

        header, footer { background: #102a43; color: #fff; }

        .container {
            width: min(1100px, calc(100% - 40px));
            margin: 0 auto;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 18px;
            padding: 16px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: inherit;
            font-weight: 700;
            text-decoration: none;
        }

        .brand img { width: 76px; height: 48px; object-fit: contain; }
        nav { display: flex; flex-wrap: wrap; gap: 6px; }
        nav a { border-radius: 6px; color: inherit; padding: 8px 10px; text-decoration: none; }
        nav a:hover, nav a:focus-visible, nav a[aria-current="page"] { background: #ffffff24; }

        main { padding: 42px 0 58px; }

        section {
            margin-bottom: 20px;
            padding: 26px;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 8px 24px #102a4310;
        }

        h1, h2 { color: #102a43; }
        h1 { margin-top: 0; }
        .map-frame { width: 100%; height: 420px; border: 0; border-radius: 10px; }
        footer { padding: 20px 0; }
        footer p { margin: 0; }

        @media (max-width: 700px) {
            .container { width: min(calc(100% - 28px), 1100px); }
            main { padding: 28px 0 40px; }
            section { padding: 20px; }
            .map-frame { height: 320px; }
        }
    </style>
</head>

<body>
    <header>

            <a class="brand" href="index.html">

            </a>
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html" aria-current="page">Contact</a>
                <a href="data.html">Data</a>
